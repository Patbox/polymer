base {
    archivesName = "polymer-core"
}
version = rootProject.mod_version + "+" + rootProject.minecraft_version
group = rootProject.maven_group


sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    runs {
        testmodClient {
            client()
            name = "(Core) Testmod Client"
            source sourceSets.testmod
        }
        testmodServer {
            server()
            name = "(Core) Testmod Server"
            source sourceSets.testmod
        }
    }

    accessWidenerPath = file("src/main/resources/polymer-core.accesswidener")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

dependencies {
    //modRuntime "supercoder79:databreaker:0.2.7"

    //modCompileOnly('maven.modrinth:lithium:mc1.21.9-0.19.0-fabric')



    compileOnly /*modLocalRuntime*/("maven.modrinth:jade:26.0.8+fabric") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    compileOnly /*modLocalRuntime*/("mcp.mobius.waila:wthit:fabric-19.0.1"){
        exclude(group: "net.fabricmc.fabric-api")
    }

    //modCompileOnly /*modLocalRuntime*/ ("me.shedaniel:RoughlyEnoughItems-fabric:20.0.811"){
    //    exclude(group: "net.fabricmc.fabric-api")
    //}
    //modCompileOnly /*modLocalRuntime*/("dev.emi:emi-fabric:1.1.6+1.20.6"){
    //    exclude(group: "net.fabricmc.fabric-api")
    //}

    compileOnly /*modRuntimeOnly*/("maven.modrinth:jei:29.5.0.26"){
        exclude(group: "net.fabricmc.fabric-api")
    }

    //modCompileOnly ("mcjty.theoneprobe:theoneprobe-fabric:1.18.2-5.0.9")
    //modRuntimeOnly ("mcjty.theoneprobe:theoneprobe-fabric:1.18.2-5.0.9")

    //modCompileOnly "xyz.nucleoid:disguiselib-fabric:1.2.2"

    compileOnly("xyz.nucleoid:server-translations-api:3.0.1+26.1"){
        exclude(group: "net.fabricmc.fabric-api")
    }

    //modCompileOnly ('com.github.iPortalTeam:ImmersivePortalsMod:v5.1.0-mc1.20.4') {
    //    exclude(group: "net.fabricmc.fabric-api")
    //}

    //modLocalRuntime 'maven.modrinth:immersiveportals:v3.0.2-mc1.20'
    // PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
    // You may need to force-disable transitiveness on them.

    testmodImplementation sourceSets.main.output

    api (project(path: ':polymer-reg-sync-manipulator'))
    include(project(path: ':polymer-reg-sync-manipulator'))
    api project(path: ':polymer-common')
    api (project(path: ':polymer-networking'))
    include(project(path: ':polymer-networking'))

    compileOnly (project(path: ':polymer-resource-pack'))
    localRuntime (project(path: ':polymer-resource-pack'))
    compileOnly (project(path: ':polymer-resource-pack-extras'))
    localRuntime (project(path: ':polymer-resource-pack-extras'))
    compileOnly (project(path: ':polymer-virtual-entity'))
    localRuntime (project(path: ':polymer-virtual-entity'))

    project(":polymer-sound-patcher").afterEvaluate {
        testmodImplementation project(":polymer-sound-patcher")
    }
}