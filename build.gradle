if (System.getenv("MODRINTH")) {
    modrinth {
        token = System.getenv("MODRINTH")
        projectId = 'xGdtZczs'// The ID of your modrinth project, slugs will not work.
        versionNumber = "" + version // The version of the mod to upload.
        versionType = isStable ? "release" : "beta"
        uploadFile = jar // This links to a task that builds your mod jar and sets "uploadFile" to the mod jar.


        List<String> supportedVersions = new ArrayList<>();
        supportedVersions.add(project.minecraft_version);
        for (String a : project.mc_extra_supported.split(",")) {
            if (!a.strip().isEmpty()) {
                supportedVersions.add(a.strip())
            }
        }

        gameVersions = supportedVersions
        changelog = System.getenv("CHANGELOG")
        loaders = ["fabric"]
    }

    jar {
        finalizedBy project.tasks.modrinth
    }
}



// configure the maven publication

allprojects {
    apply plugin: 'maven-publish'

    processResources {
        doLast {
            fileTree(dir: outputs.files.asPath, include: "**/*.json").each {
                File file -> file.text = com.google.gson.JsonParser.parseString(file.text).toString()
            }
        }
    }

    classes {
        doLast {
            fileTree(dir: project.sourceSets.main.output.classesDirs.asPath, include: "**/*.json").each {
                File file -> file.text = com.google.gson.JsonParser.parseString(file.text).toString()
            }
        }
    }

    jar {
        doLast {
            fileTree(dir: outputs.files.asPath, include: "**/*.json").each {
                File file -> file.text = com.google.gson.JsonParser.parseString(file.text).toString()
            }
        }
    }

    afterEvaluate {
        if (project.version != "0.0.0-alpha.0") {
            publishing {
                publications {
                    mavenJava(MavenPublication) {
                        groupId = rootProject.maven_group
                        artifactId = project.base.archivesName.get()
                        version = project.version

                        from components.java
                    }

                }

                setupRepositories(repositories)
            }
        }
    }
}

